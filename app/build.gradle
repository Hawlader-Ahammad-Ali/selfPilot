plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace = "com.example.selfpilot"
    compileSdk = 37

    defaultConfig {
        applicationId = "com.example.selfpilot"
        minSdk = 24
        targetSdk = 37
        versionCode = 14
        versionName = "2.3"

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        // v1 (JAR) signature is required by Android 6 and by several OEM package
        // installers; v2/v3 keep modern devices happy. Without v1 the installer reports
        // "package appears to be invalid" instead of a real error.
        debug {
            enableV1Signing = true
            enableV2Signing = true
            enableV3Signing = true
        }
    }

    buildTypes {
        release {
            optimization {
                enable = true
                packageScope = ["androidx.**", "kotlin.**", "kotlinx.**"] as Set
            }
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }
}

dependencies {
    implementation libs.activity.ktx
    implementation libs.appcompat
    implementation libs.constraintlayout
    implementation libs.material

    // Room
    implementation libs.room.runtime
    annotationProcessor libs.room.compiler

    // Navigation
    implementation libs.nav.fragment
    implementation libs.nav.ui

    // Lifecycle
    implementation libs.lifecycle.viewmodel
    implementation libs.lifecycle.livedata

    // WorkManager
    implementation libs.work.runtime

    // Google Sign-In (Credential Manager - no Firebase SDK needed for the UI)
    implementation libs.credentials
    implementation libs.credentials.play
    implementation libs.googleid
    implementation libs.playservices.auth
    implementation libs.firebase.auth

    // Shizuku
    implementation libs.shizuku.api
    implementation libs.shizuku.provider

    // MPAndroidChart
    implementation libs.mpandroidchart

    testImplementation libs.junit
    androidTestImplementation libs.espresso.core
    androidTestImplementation libs.ext.junit
}
